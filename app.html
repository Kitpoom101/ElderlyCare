<!doctype html>
<html lang="th" class="lang-th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JangChad</title>
<meta name="description" content="JangChad demo — purchase orders, invoices, withholding tax and 50 ทวิ certificates between companies and freelancers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<script src="assets/js/i18n.js"></script>
</head>
<body>

<div class="demo-banner" data-i18n="demoBanner"></div>
<header class="topbar">
  <a href="index.html" class="wordmark" aria-label="JangChad home">
    <svg width="24" height="24" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 4h12l6 6v18H8z"/><path d="M20 4v6h6M12 16h10M12 21h6"/><path d="M19 23l2.5 2.5L26 20"/></svg>
    <span class="wm-text">JangChad</span>
  </a>
  <div class="seg" role="group" aria-label="Role">
    <button type="button" data-act="role" data-role="company" data-i18n="role.company"></button>
    <button type="button" data-act="role" data-role="freelancer" data-i18n="role.freelancer"></button>
  </div>
  <label class="persona"><span data-i18n="persona.as"></span><select id="persona"></select></label>
  <div class="tb-right">
    <button type="button" class="lang-toggle" data-lang-toggle>EN</button>
    <div class="bell">
      <button type="button" id="bellBtn" class="icon-btn" data-act="bell" aria-expanded="false" data-i18n-title="alerts">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge" hidden></span>
      </button>
      <div id="bellPanel" class="bell-panel" hidden></div>
    </div>
    <button type="button" class="btn line sm" data-act="reset" data-i18n="reset"></button>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="view" tabindex="-1"></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header><h3 id="modalTitle"></h3><button type="button" data-act="close" aria-label="Close">×</button></header>
    <div id="modalBody"></div>
  </div>
</div>

<div class="docview" id="docView" hidden>
  <div class="docbar">
    <button type="button" class="btn solid sm" data-act="print" data-i18n="print"></button>
    <button type="button" class="btn line sm" data-act="closeDoc" data-i18n="closeDoc"></button>
  </div>
  <div id="docPapers"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="assets/js/tax.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/docs.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
